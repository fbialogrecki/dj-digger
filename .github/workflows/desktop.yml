name: Desktop tests and test installers
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0
      - name: Desktop contracts
        run: uv run --frozen --extra dev --extra gui --python 3.12 pytest tests/test_gui.py tests/test_bundled_tools.py
      - name: Isolated desktop smoke
        run: uv run --frozen --extra gui --python 3.12 python scripts/gui_smoke.py
  installer:
    needs: gui
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Build offline installer
        run: uv run --frozen --extra gui --extra play --extra analyze --group desktop-build --python 3.12 python packaging/windows/build.py
      - name: Frozen desktop smoke
        run: uv run --frozen --python 3.12 python scripts/gui_smoke.py dist/dj-digger/dj-digger-gui.exe --runtime
      - name: Installer lifecycle and installed runtime
        run: uv run --frozen --python 3.12 python packaging/windows/test_installer.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x64-test-installer
          path: |
            dist/installer/*
            dist/dj-digger/build-manifest.json
          if-no-files-found: error
          retention-days: 14

  dmg:
    name: macOS DMG (${{ matrix.arch }})
    needs: gui
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Install build-time media tools
        run: brew install ffmpeg
      - name: Build offline test DMG (no Developer ID or notarization)
        run: uv run --frozen --extra gui --extra play --extra analyze --group desktop-build --python 3.12 python packaging/macos/build.py
      - name: Mount DMG and verify copied application
        run: uv run --frozen --python 3.12 python packaging/macos/test_dmg.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-${{ matrix.arch }}-test-dmg
          path: dist/installer/*
          if-no-files-found: error
          retention-days: 14
