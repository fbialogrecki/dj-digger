name: Website

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    environment: website
    permissions:
      contents: read
      id-token: write
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      GA4_MEASUREMENT_ID: ${{ vars.GA4_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || 'main' }}
          persist-credentials: false
      - name: Validate production configuration
        env:
          PROVIDER: ${{ vars.FIREBASE_IDENTITY_PROVIDER }}
          ACCOUNT: ${{ vars.FIREBASE_DEPLOY_ACCOUNT }}
        run: |
          test "$SITE_URL" = https://djdigger.app
          test "$FIREBASE_PROJECT_ID" = dj-digger-a9664
          test -n "$PROVIDER" && test -n "$ACCOUNT"
          [[ "$GA4_MEASUREMENT_ID" =~ ^G-[A-Z0-9]+$ ]]
      - name: Resolve available stable downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/site_release.py >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Check consent in isolated Chromium
        run: uv run --script site/scripts/check-consent.py
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_ACCOUNT }}
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
      - name: Deploy verified site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "v$DOWNLOAD_VERSION" = "$(gh api repos/$GITHUB_REPOSITORY/releases/latest --jq .tag_name)"
          test "$(git rev-parse HEAD)" = "$(gh api repos/$GITHUB_REPOSITORY/commits/main --jq .sha)"
          npx --yes firebase-tools@15.36.0 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive --message "main $(git rev-parse HEAD), downloads v$DOWNLOAD_VERSION"
