name: Live API check

# tests/test_live.py is the only thing standing between us and SoundCloud
# changing api-v2 under the client, and it is opt-in (`addopts = -m 'not live'`),
# so in practice it ran when somebody remembered. Once a week it runs by itself.
#
# Deliberately not a gate on anything: it fails when somebody else's API moves,
# which is news rather than a reason to block a release.
on:
  schedule:
    # Mondays, 06:00 UTC. Early enough in the week to do something about it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Hit the real api-v2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run the live tests
        # Point these at another playlist by setting DJ_DIGGER_LIVE_URL in the
        # repository variables, for when the default one disappears.
        env:
          DJ_DIGGER_LIVE_URL: ${{ vars.DJ_DIGGER_LIVE_URL }}
        run: uv run --extra dev pytest -m live
