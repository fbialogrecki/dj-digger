[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dj-soundcloud-digger"
version = "0.5.1"
description = "Dig purchase and free-download links out of SoundCloud playlists, likes and profiles"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["soundcloud", "dj", "bandcamp", "beatport", "crate-digging"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "textual>=0.60",
    "rich>=13.0",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
# Audio preview. Kept optional so a platform without a miniaudio wheel can still
# install the link digger; the player degrades with a message when it is absent.
play = ["miniaudio>=1.59"]
dev = ["pytest>=7.0", "miniaudio>=1.59"]

[project.scripts]
dj-digger = "dj_digger.cli:main"

[project.urls]
Homepage = "https://github.com/fbialogrecki/dj-soundcloud-digger"

[tool.hatch.build.targets.wheel]
packages = ["dj_digger"]

[tool.pytest.ini_options]
markers = [
    "live: hits the real SoundCloud API (deselected by default, run with -m live)",
]
addopts = "-m 'not live'"
