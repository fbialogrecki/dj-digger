<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>dj-digger</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="panel" class="idle">
    <header><img src="icons/icon-32.png" alt="" width="16" height="16"><span>dj-digger</span></header>
    <section id="gates" class="card alert" hidden>
      <p id="gatesText" role="status"></p>
      <div class="row actions">
        <button id="gatesOpen" class="text strong" type="button">Open them</button>
        <button id="gatesSkip" class="text" type="button">Skip them</button>
      </div>
    </section>
    <section id="install" class="card alert" hidden>
      <p role="status">The dj-digger desktop app is not installed. Install it and start it once.</p>
      <button id="download" class="text strong wide" type="button">Download dj-digger</button>
    </section>
    <section id="import" class="card" hidden>
      <button id="importButton" class="text strong wide" type="button"></button>
      <p id="importDone" class="note" role="status" hidden>Importing in dj-digger…</p>
    </section>
    <div class="tile" aria-hidden="true">
      <canvas id="backdrop"></canvas>
      <div class="disc">
        <canvas id="code"></canvas>
        <div class="label"><img id="art" alt=""></div>
      </div>
    </div>
    <div class="meta" aria-live="polite">
      <p id="title" class="title">Open dj-digger to control playback</p>
      <p id="artist" class="artist"></p>
    </div>
    <div class="seek">
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek" disabled>
      <div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
    </div>
    <div class="transport">
      <button id="prev" type="button" aria-label="Previous track" title="Previous track" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4 H7 V20 H4 Z M20 4 L8 12 L20 20 Z"/></svg>
      </button>
      <button id="toggle" class="play" type="button" aria-label="Play" title="Play" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path id="toggleIcon" d="M7 4 L21 12 L7 20 Z"/></svg>
      </button>
      <button id="next" type="button" aria-label="Next track" title="Next track" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 4 H20 V20 H17 Z M4 4 L16 12 L4 20 Z"/></svg>
      </button>
    </div>
    <section id="job" class="card" hidden>
      <div class="row">
        <p id="jobLabel" class="job" role="status"></p>
        <button id="cancel" class="text" type="button">Cancel</button>
      </div>
      <progress id="jobBar" max="1" value="0" hidden></progress>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
